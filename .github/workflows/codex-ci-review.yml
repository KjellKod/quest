name: Codex CI Code Review

on:
  pull_request:
    types: [ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: codex-ci-review
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API key availability
        id: check-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not available. Skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gather PR context
        if: steps.check-key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --patch > /tmp/pr.diff
          gh pr view ${{ github.event.pull_request.number }} \
            --json title,body --jq '.title + "\n\n" + (.body // "")' > /tmp/pr_description.txt

      - name: Fetch existing review comments and replies
        if: steps.check-key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch ALL inline review comments (bot + human) with thread info
          gh api --paginate --slurp "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments" \
            --jq 'map(.[]) | map({id, in_reply_to_id, user: .user.login, path, body})' \
            > /tmp/existing_comments.json 2>/dev/null || echo "[]" > /tmp/existing_comments.json

      - name: Build review prompt
        if: steps.check-key.outputs.skip != 'true'
        run: |
          sed -e '/{PLACEHOLDER_PR_DESCRIPTION}/r /tmp/pr_description.txt' \
              -e '/{PLACEHOLDER_PR_DESCRIPTION}/d' \
              -e '/{PLACEHOLDER_EXISTING_COMMENTS}/r /tmp/existing_comments.json' \
              -e '/{PLACEHOLDER_EXISTING_COMMENTS}/d' \
              -e '/{PLACEHOLDER_DIFF}/r /tmp/pr.diff' \
              -e '/{PLACEHOLDER_DIFF}/d' \
              .github/codex-review-prompt.md > /tmp/review-prompt.md

      - name: AI Code Review
        if: steps.check-key.outputs.skip != 'true'
        id: review
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/review-prompt.md
          sandbox: read-only
          safety-strategy: drop-sudo
          effort: high
          output-file: /tmp/review-output.json

      - name: Post inline review
        if: always() && steps.check-key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          STRICT_INLINE_POSTING: "false"
        run: |
          if [ ! -s /tmp/review-output.json ]; then
            echo "::warning::No AI review output file produced. Skipping inline review posting."
            exit 0
          fi

          python3 << 'PYEOF'
          import json, re, sys, os

          raw = open("/tmp/review-output.json").read()

          comments = None

          # Try direct JSON parse
          try:
              parsed = json.loads(raw)
              if isinstance(parsed, list):
                  comments = parsed
          except (json.JSONDecodeError, ValueError):
              pass

          # Try stripping markdown fences
          if comments is None:
              stripped = re.sub(r'```[\w]*\n?', '', raw)
              try:
                  parsed = json.loads(stripped.strip())
                  if isinstance(parsed, list):
                      comments = parsed
              except (json.JSONDecodeError, ValueError):
                  pass

          # Try extracting from fenced code blocks
          if comments is None:
              for fence_match in re.finditer(r'```(?:json)?\s*\n(.*?)```', raw, re.DOTALL):
                  try:
                      parsed = json.loads(fence_match.group(1))
                      if isinstance(parsed, list):
                          comments = parsed
                          break
                  except (json.JSONDecodeError, ValueError):
                      continue

          # Try finding any JSON array in the text
          if comments is None:
              for match in re.finditer(r'\[.*?\]', stripped, re.DOTALL):
                  try:
                      candidate = json.loads(match.group())
                      if isinstance(candidate, list):
                          comments = candidate
                          break
                  except (json.JSONDecodeError, ValueError):
                      continue

          if comments is None:
              print("No review comments -- could not parse JSON array from output.")
              sys.exit(0)

          if not isinstance(comments, list) or not comments:
              print("No review comments.")
              sys.exit(0)

          def is_valid_comment(c):
              if not isinstance(c, dict):
                  return False
              if not (isinstance(c.get("path"), str) and c["path"]):
                  return False
              if not (isinstance(c.get("body"), str) and c["body"]):
                  return False
              try:
                  c["line"] = int(c["line"])
              except (TypeError, ValueError):
                  return False
              if c["line"] < 1:
                  return False
              if c.get("side") not in ("LEFT", "RIGHT"):
                  c["side"] = "RIGHT"
              return True

          valid = [c for c in comments if is_valid_comment(c)]
          if not valid:
              print("No valid review comments after structural validation.")
              sys.exit(0)
          if len(valid) < len(comments):
              print(f"Filtered {len(comments) - len(valid)} malformed comment(s).")
          comments = valid

          import subprocess
          import tempfile

          # --- Dedup: filter out comments that already exist on the PR ---
          existing = []
          try:
              existing = json.load(open("/tmp/existing_comments.json"))
          except Exception:
              pass

          def is_duplicate(new_comment, existing_comments):
              """Check if a comment on the same path with similar body already exists."""
              new_path = new_comment.get("path", "")
              new_body = new_comment.get("body", "").strip().lower()
              # Extract first sentence as fingerprint (severity + core message)
              new_fingerprint = new_body[:200]
              for ex in existing_comments:
                  if ex.get("path") != new_path:
                      continue
                  ex_body = ex.get("body", "").strip().lower()
                  # Exact match
                  if new_body == ex_body:
                      return True
                  # Same first 200 chars (same core concern, minor wording change)
                  if ex_body[:200] == new_fingerprint:
                      return True
              return False

          before_count = len(comments)
          comments = [c for c in comments if not is_duplicate(c, existing)]
          deduped = before_count - len(comments)
          if deduped:
              print(f"Skipped {deduped} duplicate comment(s) already posted on this PR.")

          if not comments:
              print("All comments were duplicates. Nothing new to post.")
              sys.exit(0)

          print(f"Posting {len(comments)} new inline comment(s) against commit {os.environ['COMMIT_SHA'][:8]}.")

          posted = 0
          failed = []

          for idx, c in enumerate(comments):
              payload = {
                  "body": c["body"],
                  "commit_id": os.environ["COMMIT_SHA"],
                  "path": c["path"],
                  "line": c["line"],
                  "side": c.get("side", "RIGHT"),
              }

              with tempfile.NamedTemporaryFile("w", delete=False) as tf:
                  json.dump(payload, tf)
                  temp_path = tf.name

              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "-X",
                      "POST",
                      f"repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}/comments",
                      "--input",
                      temp_path,
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )

              if result.returncode == 0:
                  posted += 1
              else:
                  failed.append(
                      {
                          "index": idx,
                          "path": c.get("path"),
                          "line": c.get("line"),
                          "side": c.get("side"),
                          "error": (result.stderr or result.stdout or "").strip(),
                      }
                  )

          print(f"Posted {posted} inline comment(s). Failed: {len(failed)}.")

          if failed:
              print("::warning::Some inline comments could not be posted (often invalid path/line).")
              for f in failed:
                  print(
                      f"::warning::[{f['index']}] path={f['path']} line={f['line']} side={f['side']} error={f['error'][:500]}"
                  )

          if posted == 0 and comments:
              strict = os.environ.get("STRICT_INLINE_POSTING", "false").lower() in (
                  "1",
                  "true",
                  "yes",
              )
              print("::warning::No inline comments were posted; all candidate comments failed.")
              if strict:
                  print("::error::STRICT_INLINE_POSTING is enabled; failing job.")
                  sys.exit(1)
          PYEOF
