name: Codex CI Code Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'KjellKod' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: codex-ci-review
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check API key availability
        id: check-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not available. Skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gather PR context
        if: steps.check-key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --patch > /tmp/pr.diff
          gh pr view ${{ github.event.pull_request.number }} \
            --json title,body --jq '.title + "\n\n" + (.body // "")' > /tmp/pr_description.txt
          gh pr view ${{ github.event.pull_request.number }} \
            --json headRefOid --jq '.headRefOid' > /tmp/pr_head_sha.txt
          gh pr view ${{ github.event.pull_request.number }} \
            --json files --jq '.files[].path' > /tmp/changed_files.txt

          python3 <<'PYEOF'
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          repo = os.environ['REPO']
          head_sha = Path('/tmp/pr_head_sha.txt').read_text(encoding='utf-8').strip()
          changed_files = [
              line.strip()
              for line in Path('/tmp/changed_files.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]

          max_files = 12
          max_chars = 12000
          rendered = []
          for path in changed_files[:max_files]:
              encoded_path = quote(path, safe='/')
              cmd = [
                  'gh', 'api',
                  '-H', 'Accept: application/vnd.github.raw',
                  f'repos/{repo}/contents/{encoded_path}?ref={head_sha}',
              ]
              try:
                  result = subprocess.run(cmd, check=True, capture_output=True, text=True)
                  content = result.stdout
              except subprocess.CalledProcessError as exc:
                  detail = exc.stderr.strip() or exc.stdout.strip() or 'unable to fetch file snapshot'
                  content = f'[unavailable: {detail}]'

              if len(content) > max_chars:
                  content = content[:max_chars] + '\n... [truncated]\n'

              rendered.append(f'## {path}\n```\n{content.rstrip()}\n```')

          if len(changed_files) > max_files:
              rendered.append(
                  f'## Additional changed files omitted\nOnly the first {max_files} changed files are included here for context. '
                  'Use the diff as the source of truth for the full change set.'
              )

          Path('/tmp/pr_head_files.md').write_text('\n\n'.join(rendered).strip() + '\n', encoding='utf-8')
          PYEOF

      - name: Fetch existing review comments and replies
        if: steps.check-key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # Fetch ALL inline review comments (bot + human) with thread info
          # Use --paginate with --jq (no --slurp) to stream pages through jq individually.
          # Wrap output in a JSON array for downstream consumption.
          if gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | {id, in_reply_to_id, user: .user.login, path, line, body}' 2>/tmp/fetch_comments_err.log \
            | awk 'NR>1{print ","} {printf "%s",$0}' > /tmp/existing_comments_body.json; then
            # Wrap in JSON array
            printf '[%s]' "$(cat /tmp/existing_comments_body.json)" > /tmp/existing_comments.json
            # Validate JSON structure
            if ! python3 -c "import json; json.load(open('/tmp/existing_comments.json'))" 2>/dev/null; then
              echo "::warning::Fetched comments but JSON is malformed. Dedup will be skipped."
              echo "[]" > /tmp/existing_comments.json
            fi
          else
            echo "::warning::Failed to fetch existing comments (gh api exit $?). Dedup will be skipped."
            cat /tmp/fetch_comments_err.log >&2 || true
            echo "[]" > /tmp/existing_comments.json
          fi

      - name: Build review prompt
        if: steps.check-key.outputs.skip != 'true'
        run: |
          sed -e '/{PLACEHOLDER_PR_DESCRIPTION}/r /tmp/pr_description.txt' \
              -e '/{PLACEHOLDER_PR_DESCRIPTION}/d' \
              -e '/{PLACEHOLDER_EXISTING_COMMENTS}/r /tmp/existing_comments.json' \
              -e '/{PLACEHOLDER_EXISTING_COMMENTS}/d' \
              -e '/{PLACEHOLDER_PR_HEAD_FILES}/r /tmp/pr_head_files.md' \
              -e '/{PLACEHOLDER_PR_HEAD_FILES}/d' \
              -e '/{PLACEHOLDER_DIFF}/r /tmp/pr.diff' \
              -e '/{PLACEHOLDER_DIFF}/d' \
              .github/codex-review-prompt.md > /tmp/review-prompt.md

      - name: AI Code Review
        if: steps.check-key.outputs.skip != 'true'
        id: review
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/review-prompt.md
          sandbox: read-only
          safety-strategy: drop-sudo
          effort: high
          output-file: /tmp/review-output.json

      - name: Post inline review
        if: always() && steps.check-key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          STRICT_INLINE_POSTING: "false"
        run: |
          if [ ! -s /tmp/review-output.json ]; then
            echo "::warning::No AI review output file produced. Skipping inline review posting."
            exit 0
          fi

          python3 << 'PYEOF'
          import json, re, sys, os

          raw = open("/tmp/review-output.json").read()

          comments = None

          # Try direct JSON parse
          try:
              parsed = json.loads(raw)
              if isinstance(parsed, list):
                  comments = parsed
          except (json.JSONDecodeError, ValueError):
              pass

          # Try stripping markdown fences
          if comments is None:
              stripped = re.sub(r'```[\w]*\n?', '', raw)
              try:
                  parsed = json.loads(stripped.strip())
                  if isinstance(parsed, list):
                      comments = parsed
              except (json.JSONDecodeError, ValueError):
                  pass

          # Try extracting from fenced code blocks
          if comments is None:
              for fence_match in re.finditer(r'```(?:json)?\s*\n(.*?)```', raw, re.DOTALL):
                  try:
                      parsed = json.loads(fence_match.group(1))
                      if isinstance(parsed, list):
                          comments = parsed
                          break
                  except (json.JSONDecodeError, ValueError):
                      continue

          # Try finding any JSON array in the text
          if comments is None:
              for match in re.finditer(r'\[.*?\]', stripped, re.DOTALL):
                  try:
                      candidate = json.loads(match.group())
                      if isinstance(candidate, list):
                          comments = candidate
                          break
                  except (json.JSONDecodeError, ValueError):
                      continue

          if comments is None:
              print("No review comments -- could not parse JSON array from output.")
              sys.exit(0)

          if not isinstance(comments, list) or not comments:
              print("No review comments.")
              sys.exit(0)

          VALID_SEVERITIES = {"blocker", "must-fix", "should-fix"}

          def normalize_severity(value):
              if not isinstance(value, str):
                  return None
              normalized = value.strip().lower()
              return normalized if normalized in VALID_SEVERITIES else None

          def is_valid_comment(c):
              if not isinstance(c, dict):
                  return False
              if not (isinstance(c.get("path"), str) and c["path"]):
                  return False
              if not (isinstance(c.get("body"), str) and c["body"]):
                  return False
              try:
                  c["line"] = int(c["line"])
              except (TypeError, ValueError):
                  return False
              if c["line"] < 1:
                  return False
              if c.get("side") not in ("LEFT", "RIGHT"):
                  c["side"] = "RIGHT"
              severity = c.get("severity")
              if severity is None:
                  return True
              normalized_severity = normalize_severity(severity)
              if normalized_severity is None:
                  c.pop("severity", None)
                  c["_severity_stripped"] = True
              else:
                  c["severity"] = normalized_severity
              return True

          valid = [c for c in comments if is_valid_comment(c)]
          if not valid:
              print("No valid review comments after structural validation.")
              sys.exit(0)
          if len(valid) < len(comments):
              print(f"Filtered {len(comments) - len(valid)} malformed comment(s).")
          stripped_invalid_severity = sum(1 for c in valid if c.pop("_severity_stripped", False))
          if stripped_invalid_severity:
              print(
                  f"Ignored invalid structured severity on {stripped_invalid_severity} comment(s); "
                  "preserving body-based behavior."
              )
          comments = valid

          import subprocess
          import tempfile

          # --- Dedup: filter out already-discussed and resolved concerns ---
          existing = []
          try:
              existing = json.load(open("/tmp/existing_comments.json"))
          except Exception:
              pass

          # Build set of (path, line) pairs where a human already replied to a bot comment.
          # These threads are considered resolved — never post there again.
          bot_comment_ids = {}  # id -> {path, line}
          for ex in existing:
              if ex.get("user") == "github-actions[bot]":
                  bot_comment_ids[ex.get("id")] = {
                      "path": ex.get("path"),
                      "line": ex.get("line"),
                  }

          resolved_locations = set()  # (path, line) tuples where human replied
          for ex in existing:
              reply_to = ex.get("in_reply_to_id")
              if reply_to and ex.get("user") != "github-actions[bot]":
                  parent = bot_comment_ids.get(reply_to)
                  if parent:
                      resolved_locations.add((parent["path"], parent.get("line")))

          # Also build set of (path, line) where bot already commented (any wording)
          bot_commented_locations = set()
          for ex in existing:
              if ex.get("user") == "github-actions[bot]" and ex.get("path"):
                  bot_commented_locations.add((ex["path"], ex.get("line")))

          def extract_keywords(body):
              """Extract meaningful words (4+ chars) for fuzzy matching."""
              words = set(re.findall(r'[a-z][a-z0-9_.-]{3,}', body.lower()))
              # Remove common filler words
              words -= {"this", "that", "with", "from", "have", "been", "should",
                        "could", "would", "must", "which", "when", "into", "more",
                        "than", "also", "only", "will", "does", "about", "because",
                        "review", "automated", "openai", "codex", "comment", "file"}
              return words

          bot_concerns = []  # list of {path, line, keywords}
          for ex in existing:
              if ex.get("user") == "github-actions[bot]" and ex.get("body"):
                  bot_concerns.append({
                      "path": ex.get("path"),
                      "line": ex.get("line"),
                      "keywords": extract_keywords(ex["body"]),
                  })

          def is_duplicate(new_comment):
              new_path = new_comment.get("path", "")
              new_line = new_comment.get("line")

              # Hard block: human already replied on this exact location
              if (new_path, new_line) in resolved_locations:
                  return "resolved"

              # Hard block: bot already commented on this exact path+line
              if (new_path, new_line) in bot_commented_locations:
                  return "already-commented"

              # Fuzzy block: same path, high keyword overlap with existing bot comment
              new_kw = extract_keywords(new_comment.get("body", ""))
              for bc in bot_concerns:
                  if bc["path"] != new_path:
                      continue
                  if not bc["keywords"] or not new_kw:
                      continue
                  overlap = len(new_kw & bc["keywords"])
                  union = len(new_kw | bc["keywords"])
                  if union > 0 and overlap / union > 0.4:
                      return "similar-concern"

              return None

          before_count = len(comments)
          skipped = {"resolved": 0, "already-commented": 0, "similar-concern": 0}
          filtered = []
          for c in comments:
              reason = is_duplicate(c)
              if reason:
                  skipped[reason] = skipped.get(reason, 0) + 1
              else:
                  filtered.append(c)
          comments = filtered
          total_skipped = before_count - len(comments)

          if total_skipped:
              parts = [f"{v} {k}" for k, v in skipped.items() if v > 0]
              print(f"Skipped {total_skipped} comment(s): {', '.join(parts)}.")

          if not comments:
              print("All comments were duplicates or already resolved. Nothing new to post.")
              sys.exit(0)

          print(f"Posting {len(comments)} new inline comment(s) against commit {os.environ['COMMIT_SHA'][:8]}.")

          posted = 0
          failed = []

          for idx, c in enumerate(comments):
              severity = c.get("severity") or "none"
              print(
                  f"[{idx}] posting path={c['path']} line={c['line']} side={c.get('side', 'RIGHT')} severity={severity}"
              )
              payload = {
                  "body": c["body"],
                  "commit_id": os.environ["COMMIT_SHA"],
                  "path": c["path"],
                  "line": c["line"],
                  "side": c.get("side", "RIGHT"),
              }

              with tempfile.NamedTemporaryFile("w", delete=False) as tf:
                  json.dump(payload, tf)
                  temp_path = tf.name

              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "-X",
                      "POST",
                      f"repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}/comments",
                      "--input",
                      temp_path,
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )

              if result.returncode == 0:
                  posted += 1
              else:
                  failed.append(
                      {
                          "index": idx,
                          "path": c.get("path"),
                          "line": c.get("line"),
                          "side": c.get("side"),
                          "severity": severity,
                          "error": (result.stderr or result.stdout or "").strip(),
                      }
                  )

          print(f"Posted {posted} inline comment(s). Failed: {len(failed)}.")

          if failed:
              print("::warning::Some inline comments could not be posted (often invalid path/line).")
              for f in failed:
                  print(
                      f"::warning::[{f['index']}] path={f['path']} line={f['line']} side={f['side']} "
                      f"severity={f['severity']} error={f['error'][:500]}"
                  )

          if posted == 0 and comments:
              strict = os.environ.get("STRICT_INLINE_POSTING", "false").lower() in (
                  "1",
                  "true",
                  "yes",
              )
              print("::warning::No inline comments were posted; all candidate comments failed.")

              fallback_payload = {
                  "event": "COMMENT",
                  "body": (
                      "Automated review generated findings, but inline posting failed for all "
                      f"{len(comments)} candidate comment(s). "
                      "This is advisory-only by default; check workflow logs for details."
                  ),
              }
              with tempfile.NamedTemporaryFile("w", delete=False) as tf:
                  json.dump(fallback_payload, tf)
                  fallback_path = tf.name

              fallback_result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "-X",
                      "POST",
                      f"repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}/reviews",
                      "--input",
                      fallback_path,
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if fallback_result.returncode != 0:
                  fallback_error = (
                      fallback_result.stderr or fallback_result.stdout or "unknown error"
                  ).strip()
                  print(
                      "::warning::Failed to post PR-visible fallback review comment: "
                      + fallback_error[:500]
                  )

              if strict:
                  print("::error::STRICT_INLINE_POSTING is enabled; failing job.")
                  sys.exit(1)
          PYEOF
