name: Validate_Quest_Configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: python3 -m pip install check-jsonschema==0.37.2

      - name: Run validation script
        run: |
          chmod +x scripts/quest_validate-quest-config.sh
          ./scripts/quest_validate-quest-config.sh

      - name: Validate allowlist against schema
        run: check-jsonschema --schemafile .ai/schemas/allowlist.schema.json .ai/allowlist.json

      - name: Validate manifest completeness
        run: |
          chmod +x scripts/quest_validate-manifest.sh
          ./scripts/quest_validate-manifest.sh --strict

      - name: Validate handoff contracts
        run: |
          chmod +x scripts/quest_validate-handoff-contracts.sh
          ./scripts/quest_validate-handoff-contracts.sh

      - name: Run state validation tests
        run: |
          chmod +x tests/test-validate-quest-state.sh
          bash tests/test-validate-quest-state.sh
