name: Codex Version Drift

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  codex-version-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check for codex CLI drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_LABEL: codex-drift-watcher
          DRIFT_MARKER: "<!-- codex-drift-watcher:v1 -->"
        run: |
          set -euo pipefail

          latest="$(npm view @openai/codex version)"
          pinned="$(tr -d '[:space:]' < .github/codex-cli-version.txt)"

          if [ "$latest" = "$pinned" ]; then
            echo "No drift detected (pinned=$pinned, latest=$latest)."
            exit 0
          fi

          title="[codex-drift] Codex CLI drift: $pinned -> $latest"
          body_text="$(
            printf '%s\n' \
              "$DRIFT_MARKER" \
              "" \
              "Codex CLI version drift detected." \
              "" \
              "- Pinned in repo: $pinned" \
              "- Latest npm release: $latest" \
              "" \
              "Please review and update:" \
              "- \`.github/codex-cli-version.txt\`" \
              "- any workflows or docs that rely on this baseline"
          )"

          # Ensure the management label exists. Idempotent: ignore "already exists" failure.
          gh label create "$DRIFT_LABEL" \
            --color CCCCCC \
            --description "Managed by Codex Version Drift workflow" \
            >/dev/null 2>&1 || true

          # Select candidates by label only; verify each with the body marker before mutating.
          candidates_json="$(
            gh issue list \
              --state open \
              --label "$DRIFT_LABEL" \
              --json number,body
          )"

          target_number="$(
            printf '%s' "$candidates_json" \
              | jq -r --arg marker "$DRIFT_MARKER" \
                  '[.[] | select(.body | contains($marker))] | (.[0].number // empty)'
          )"
          marked_count="$(
            printf '%s' "$candidates_json" \
              | jq -r --arg marker "$DRIFT_MARKER" \
                  '[.[] | select(.body | contains($marker))] | length'
          )"

          if [ "$marked_count" -gt 1 ]; then
            echo "::warning::Multiple open '$DRIFT_LABEL' issues carry the managed marker; creating a fresh issue to avoid mutating the wrong one."
            target_number=""
          fi

          if [ -n "$target_number" ]; then
            gh issue edit "$target_number" --title "$title" --body "$body_text"
            echo "Updated existing drift issue #$target_number."
          else
            gh issue create --title "$title" --body "$body_text" --label "$DRIFT_LABEL"
            echo "Created new drift issue."
          fi
